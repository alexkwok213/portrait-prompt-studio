<title>人像图片模板库</title>
<style>
:root{--bg:#f4f2ed;--card:#fff;--ink:#252525;--muted:#6b6b6b;--line:#e2ded6;--accent:#8a5a3b}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);max-width:1180px;margin:0 auto;padding:36px 24px;line-height:1.75}
h1{margin:0 0 6px;font-size:26px}
.sub{color:var(--muted);margin:0 0 28px;font-size:14px}
.note{background:#fff6dc;border-left:3px solid #d9a441;padding:12px 16px;border-radius:0 8px 8px 0;margin:0 0 28px;font-size:14px}
main{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}
@media(max-width:880px){main{grid-template-columns:1fr}}
aside,section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 14px}
.tpl{width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font:inherit}
.tpl:hover{border-color:var(--accent)}
.tpl[aria-current="true"]{border-color:var(--accent);background:#faf6f1}
.tpl b{display:block;font-size:15px}
.tpl span{color:var(--muted);font-size:13px}
h3{font-size:17px;margin:26px 0 8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0 4px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#faf8f5;font-weight:600;white-space:nowrap}
tr[data-protected="true"] td:first-child::after{content:"受保护";display:inline-block;margin-left:6px;font-size:11px;background:#eef2f7;color:#4a5a72;padding:1px 6px;border-radius:4px}
textarea{width:100%;min-height:180px;font:13px/1.7 ui-monospace,Menlo,monospace;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fcfbf9}
label{display:block;margin:16px 0 6px;font-size:14px}
button{padding:7px 14px;margin:8px 8px 0 0;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font:inherit}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.bad{color:#9b3a2e}.ok{color:#246149}
.status{font-size:14px;margin:8px 0 0;min-height:22px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 ui-monospace,Menlo,monospace;background:#fcfbf9;border:1px solid var(--line);border-radius:8px;padding:14px;max-height:420px;overflow:auto}
img.preview{width:100%;border-radius:10px;border:1px solid var(--line);background:#eee}
.buckets{font-size:13.5px;color:var(--muted)}
.buckets li{margin-bottom:5px}
code{background:#f0ece5;padding:1px 5px;border-radius:4px;font-size:12.5px}
</style>

<h1>人像图片模板库</h1>
<p class="sub">模板是拆解后的提示词，生成时只用文字。原图仅供人查阅，不作为生成输入。</p>
<p class="note"><b>替换模板时</b>：只改用户点名的元素，其余保持不动。<code>E7</code> 光位、<code>E9</code> 画幅机位、<code>E10</code> 成像倾向默认受保护——它们决定整体物理关系，随手改会让人物与环境的光线互相打架。</p>

<main>
  <aside>
    <h2>模板</h2>
    <div id="list"></div>
    <h2 style="margin-top:24px">替换需求</h2>
    <label for="change">要改什么（例：换成红色连衣裙 / 改成短发）</label>
    <textarea id="change" placeholder="写用户提出的替换需求"></textarea>
    <button class="pri" id="apply">生成替换清单</button>
    <p class="status" id="status"></p>
  </aside>

  <section>
    <p id="empty" class="bad">请选择一个模板。</p>
    <div id="detail" hidden>
      <h2 style="margin-top:0" id="name"></h2>
      <p class="buckets" id="meta"></p>
      <img class="preview" id="img" alt="模板预览" />
      <p class="buckets" id="srcnote"></p>

      <h3>元素表</h3>
      <div id="table"></div>

      <h3>中文提示词</h3>
      <textarea id="zh"></textarea>
      <h3>English prompt</h3>
      <textarea id="en"></textarea>
      <button class="pri" id="copy">复制当前提示词</button>
      <button id="reset">恢复模板原文</button>
      <p class="status" id="status2"></p>
    </div>
  </section>
</main>

const list = document.getElementById('list');
let current = null, pristine = {};

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function choose(t){
  current = t;
  document.querySelectorAll('.tpl').forEach(b=>b.setAttribute('aria-current', b.dataset.id===t.id));
  document.getElementById('empty').hidden = true;
  document.getElementById('detail').hidden = false;
  document.getElementById('name').textContent = t.title;
  document.getElementById('meta').textContent = t.meta;
  document.getElementById('srcnote').textContent = t.sourceNote;
  const img = document.getElementById('img');
  if (t.preview) { img.src = t.preview; img.hidden = false; } else { img.hidden = true; }
  document.getElementById('table').innerHTML =
    '<table><thead><tr><th>#</th><th>元素</th><th>当前值</th><th>可替换为</th></tr></thead><tbody>' +
    t.elements.map(e=>`<tr data-protected="${e.protected?'true':'false'}"><td>${e.id}</td><td>${esc(e.name)}</td><td>${esc(e.value)}</td><td>${esc(e.alt)}</td></tr>`).join('') +
    '</tbody></table>';
  pristine = {zh: t.zh, en: t.en};
  document.getElementById('zh').value = t.zh;
  document.getElementById('en').value = t.en;
  document.getElementById('status').textContent = '';
  document.getElementById('status2').textContent = '';
}

TEMPLATES.forEach(t=>{
  const b = document.createElement('button');
  b.className = 'tpl'; b.dataset.id = t.id;
  b.innerHTML = `<b>${esc(t.title)}</b><span>${esc(t.meta)}</span>`;
  b.onclick = ()=>choose(t);
  list.appendChild(b);
});

// 替换匹配。三层：
//  1) 字符串层——把用户输入切碎，与元素名、可替换值做双向包含匹配。
//  2) 语义层——关键词映射到元素编号，处理"连衣裙→服装"这类换词。
//  3) 组合层——"换个脸""换套发型"这类整体重塑要求，一次命中一组元素。
// 单靠字符串匹配抓不到同义替换和组合需求，所以后两层是必要的。
const SYNONYM = {
  E1:['身份','年龄','几岁','岁','小孩','孩子','女孩','男孩','族裔','小学生','初中生','身高','长高','个字'],
  E2:['脸','换个脸','换脸','面部','五官','眼','眉','鼻','嘴','唇','下巴','脸型','双眼皮','单眼皮','眼皮','长相','样子','气质'],
  E3:['头发','发型','换个发型','刘海','马尾','辫子','短发','长发','发色','碎发','扎','bob','齐刘海'],
  E4:['衣服','服装','换个服装','换套服装','换装','穿','裙','衬衫','T恤','针织','毛衣','开衫','校服','裙装','裤','连衣裙','外套','大衣','背带裤','工装','帽','贝雷帽','帽饰','鞋','袜','领','领结','围巾'],
  E5:['表情','笑','神态','眼神','注视','看','严肃','自然一点','温柔','直视','不看镜头'],
  E6:['姿势','姿态','手','动作','坐','站','扶','捧','搭','拿','袖口','袖子'],
  E7:['光','光线','打光','逆光','侧光','顶光','窗光','阴影','氛围光','暗','亮'],
  E8:['背景','场景','环境','地点','在哪','海边','教室','公园','客厅','影棚','操场','户外','室外','外面','自然景'],
  E9:['横版','竖版','画幅','比例','构图','机位','角度','俯拍','全身','半身','留白','横过来','竖过来','横着','竖着'],
  E10:['质感','颗粒','风格','调色','色调','虚化','景深','清晰','锐']
};

// 组合需求 → 必须同改的元素组。「像不像同一个人」的最小判别集是 E2+E3+E4。
const COMBO = [
  {ids:['E2','E3','E4'], kw:['换个脸','换个发型','换套服装','换装','整个人不一样','整个人都','换个人','从头到脚','整体换','换一身','都换','全换','换个人物']},
  {ids:['E2','E3'], kw:['换个脸','换个发型','头发的脸','脸和头发','发型和脸']},
  {ids:['E7','E8','E9','E10'], kw:['全部重做','整套换','重新做一张','换个风格','换种风格','换一种风格']}
];

function normalize(s){return s.replace(/（[^）]*）/g,'').trim();}
function keywords(want){
  const parts = want.split(/[，,、。；;：:\s]+/).filter(Boolean);
  const out = parts.flatMap(p=>{
    const v = p.replace(/^(换成|改成|变成|换为|改为|换|改|要|把)/,'').trim();
    return (v && v!==p) ? [p, v] : [p];
  });
  // 抽出纯数字年龄："12岁" / "改成8岁" → 补一个 "岁" 关键词，命中 E1 的年龄语义。
  if (/[0-9０-９]+\s*岁/.test(want)) out.push('岁', '年龄');
  return out;
}
function matchElements(t, want){
  const raw = keywords(want);
  const kws = raw.map(k=>normalize(k)).filter(Boolean);
  const hit = new Set();
  const idIndex = {};
  t.elements.forEach((e,i)=>{idIndex[e.id]=i;});

  // 1) 字符串层
  t.elements.forEach((e,i)=>{
    const name = normalize(e.name);
    if (kws.some(k=>name.includes(k) || k.includes(name) || e.alt.includes(k))) hit.add(i);
  });
  // 2) 语义层
  t.elements.forEach((e,i)=>{
    const syn = SYNONYM[e.id] || [];
    if (kws.some(k=>syn.some(s=>k.includes(s)))) hit.add(i);
  });
  // 3) 组合层
  COMBO.forEach(c=>{
    if (raw.some(r=>c.kw.some(k=>r.includes(k)))) {
      c.ids.forEach(id=>{ if(idIndex[id]!==undefined) hit.add(idIndex[id]); });
    }
  });
  return t.elements.filter((_,i)=>hit.has(i));
}

document.getElementById('apply').onclick = ()=>{
  const want = document.getElementById('change').value.trim();
  const st = document.getElementById('status');
  if (!current) { st.textContent='请先选择模板。'; return; }
  if (!want) { st.textContent='请填写替换需求。'; return; }
  const hits = matchElements(current, want);
  st.innerHTML = hits.length
    ? `<span class="ok">可能涉及：${hits.map(e=>e.id+' '+normalize(e.name)).join('、')}</span><br>` +
      `请在右侧只改这几项的句子，其余保持不动。` +
      (hits.some(e=>e.protected)
        ? `<br><span class="bad">其中含受保护元素：改动会影响整体物理关系，请一并检查光线与阴影是否还成立。</span>` : '')
    : `<span class="bad">未能自动匹配到元素。请对照右侧表格手动定位。</span>`;
};

document.getElementById('copy').onclick = async ()=>{
  const text = '## 中文提示词\n'+document.getElementById('zh').value+'\n\n## English prompt\n'+document.getElementById('en').value;
  try{ await navigator.clipboard.writeText(text);
    document.getElementById('status2').textContent='已复制。生成时只提交这段文字，不附原图。'; }
  catch(e){ document.getElementById('status2').textContent='浏览器未允许自动复制，请手动选中。'; }
};
document.getElementById('reset').onclick = ()=>{
  document.getElementById('zh').value = pristine.zh;
  document.getElementById('en').value = pristine.en;
  document.getElementById('status2').textContent='已恢复模板原文。';
};

if (TEMPLATES.length) choose(TEMPLATES[0]);
</script>
